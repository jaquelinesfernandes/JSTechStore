name: 'jstechstore'
version: '1.0.0'
config-version: 2

profile: 'jstechstore'

model-paths:  ["models"]
test-paths:   ["tests"]
seed-paths:   ["seeds"]
macro-paths:  ["macros"]
target-path:  "target"
clean-targets: ["target", "dbt_packages"]

vars:
  bronze_path: "{{ env_var('BRONZE_PATH', 'data/bronze') }}"
  start_date:  '2023-07-21'
  end_date:    '2026-07-20'
  dim_inicio:  '2023-01-01'
  dim_fim:     '2027-12-31'

models:
  jstechstore:
    bronze:
      +materialized: incremental
      +on_schema_change: sync_all_columns
      +tags: ['bronze', 'staging']

    silver:
      +materialized: incremental
      +on_schema_change: sync_all_columns
      +tags: ['silver']

    gold:
      dimensions:
        +materialized: table
        +tags: ['gold', 'dimension']
      facts:
        +materialized: incremental
        +on_schema_change: sync_all_columns
        +tags: ['gold', 'fact']

seeds:
  jstechstore:
    feriados_nacionais:
      +column_types:
        data: date
        nome_feriado: varchar
        tipo: varchar
