name: CI — Lint + Tests + dbt

on:
  pull_request:
    branches: [main]
    paths:
      - "transformation/**"
      - "ingestion/**"
      - "quality/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"

jobs:
  python_lint:
    name: Python — Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format check (ruff format --check)
        run: ruff format --check .

  python_tests:
    name: Python — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest tests/
        run: pytest tests/ -v --tb=short --timeout=60
        env:
          # Testes usam banco SQLite local ou mocks — sem Supabase real
          SUPABASE_DB_URL: ""
          DUCKDB_PATH: ":memory:"
          BRONZE_PATH: /tmp/bronze_ci
          SILVER_PATH: /tmp/silver_ci

  dbt_compile_test:
    name: dbt — compile + test
    runs-on: ubuntu-latest
    needs: [python_lint, python_tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: dbt deps
        working-directory: transformation/dbt_project
        env:
          DUCKDB_PATH: ":memory:"
          BRONZE_PATH: /tmp/bronze_ci
        run: dbt deps

      - name: dbt seed (feriados_nacionais)
        working-directory: transformation/dbt_project
        env:
          DUCKDB_PATH: ":memory:"
          BRONZE_PATH: /tmp/bronze_ci
        run: dbt seed --select feriados_nacionais

      - name: dbt compile
        working-directory: transformation/dbt_project
        env:
          DUCKDB_PATH: ":memory:"
          BRONZE_PATH: /tmp/bronze_ci
        run: dbt compile
        # dbt test requer dados materializados; é executado pela daily_pipeline
        # após ingestão Bronze real. Aqui só validamos a sintaxe SQL.
